name: Frontend build

on:
  pull_request:
    branches: [stage-1-foundation]
  push:
    branches: [frontend/v1-customer-pilot]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
